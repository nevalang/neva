pre-commit:
  commands:
    gofix:
      run: go fix ./...
      stage_fixed: true
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    golangci-fix:
      # Git invokes this check at commit time. The Codex Stop hook delegates to
      # this same pre-commit group earlier, without staging changes, for feedback.
      glob: "*.go"
      run: scripts/hooks/precommit-golangci-fix.sh
      stage_fixed: true

pre-push:
  commands:
    gofix-check:
      run: make gofix-check
    lint:
      run: make lint
    test-unit:
      run: make test-unit
    vulncheck:
      run: make vulncheck
