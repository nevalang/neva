name: lint
on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**.md'
      - '.codex/**'
      - '.vscode/**'
      - 'assets/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  neva_fmt_check:
    name: neva-fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: neva-fmt-check
        run: make neva-fmt-check

  gofix_check:
    name: gofix-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: gofix-check
        run: |
          go fix ./...
          git diff --exit-code

  golangci:
    name: golangci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          only-new-issues: true
          args: --config=.golangci.yml

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...
